name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    with:
      sign: ${{ github.ref_type == 'tag' }}
    permissions:
      contents: read

  # Runs only for tags, only on the self-hosted runner labelled `signer`, and only after a
  # maintainer approves the deployment to the `release` environment.
  sign-windows:
    name: Sign Windows Binaries 🔏
    if: github.ref_type == 'tag'
    runs-on: [self-hosted, signer]
    needs: build-project
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CONFIG: ${{ needs.build-project.outputs.config }}
      SIGNING_CERT_NAME: ${{ secrets.WINDOWS_SIGNING_CERT_NAME }}
      SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
      SIGNING_MACHINE_STORE: ${{ vars.WINDOWS_SIGNING_CERT_STORE == 'machine' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          # Set Up Environment 🔧
          if ( $Env:RUNNER_DEBUG -ne $null ) {
            Set-PSDebug -Trace 1
          }

          if ( ! $Env:SIGNING_CERT_NAME ) {
            throw 'WINDOWS_SIGNING_CERT_NAME secret is not set'
          }

          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          $ProductName = $BuildSpec.name
          $ProductVersion = $BuildSpec.version

          if ( '${{ github.ref_name }}' -match '^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)[0-9]*)?$' ) {
            $ProductVersion = '${{ github.ref_name }}'
            $BuildSpec.version = $ProductVersion
            $BuildSpec | ConvertTo-Json -Depth 8 | Set-Content -Path buildspec.json
          }

          "pluginName=${ProductName}" >> $env:GITHUB_OUTPUT
          "pluginVersion=${ProductVersion}" >> $env:GITHUB_OUTPUT

      - name: Download Unsigned Binaries 📥
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-project.outputs.windowsUnsignedArtifact }}
          path: ${{ github.workspace }}

      - name: Sign Binaries 🔏
        run: |
          # Sign Binaries 🔏
          $Files = @(
            "release/${Env:CONFIG}/${{ steps.setup.outputs.pluginName }}/${{ steps.setup.outputs.pluginName }}.dll"
            'deps/Spout2/BUILD/Binaries/x64/Spout.dll'
            'deps/Spout2/BUILD/Binaries/x64/SpoutDX.dll'
            'deps/Spout2/BUILD/Binaries/x64/SpoutLibrary.dll'
          )

          .github/scripts/Sign-Windows.ps1 -CertificateName $Env:SIGNING_CERT_NAME -Path $Files `
            -TimestampUrl $Env:SIGNING_TIMESTAMP_URL -MachineStore:($Env:SIGNING_MACHINE_STORE -eq 'true')

      - name: Package Plugin 📀
        run: |
          # Package Plugin 📀
          .github/scripts/Package-Windows.ps1 -Target x64 -Configuration $Env:CONFIG

          $NSIS = (Get-Command -Name makensis.exe -ErrorAction SilentlyContinue).Source
          if ( ! $NSIS ) {
            $NSIS = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          if ( ! ( Test-Path $NSIS ) ) {
            throw 'makensis.exe not found. Install NSIS on the signing runner.'
          }

          .github/scripts/BuildInstaller.ps1 -Version ${{ steps.setup.outputs.pluginVersion }} -Configuration $Env:CONFIG -NSISPath $NSIS

      - name: Sign Installer 🔏
        run: |
          # Sign Installer 🔏
          .github/scripts/Sign-Windows.ps1 -CertificateName $Env:SIGNING_CERT_NAME `
            -Path 'release/OBS_Spout2_Plugin_Install_v${{ steps.setup.outputs.pluginVersion }}.exe' `
            -TimestampUrl $Env:SIGNING_TIMESTAMP_URL -MachineStore:($Env:SIGNING_MACHINE_STORE -eq 'true')

      - name: Upload Signed Artifacts 📡
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.build-project.outputs.windowsArtifact }}
          overwrite: true
          path: |
            ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.*
            ${{ github.workspace }}/release/OBS_Spout2_Plugin_Install_v${{ steps.setup.outputs.pluginVersion }}.exe

      - name: Clean Up 🧹
        if: always()
        run: |
          # Clean Up 🧹
          Remove-Item -Path release, deps/Spout2/BUILD -Recurse -Force -ErrorAction SilentlyContinue

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: [build-project, sign-windows]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Checkout buildspec 📋
        if: fromJSON(steps.check.outputs.validTag)
        uses: actions/checkout@v4
        with:
          sparse-checkout: buildspec.json
          sparse-checkout-cone-mode: false
          path: src

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          obs_version="$(jq -r '.dependencies["obs-studio"].version' src/buildspec.json)"
          min_obs="$(echo "${obs_version}" | sed -E 's/^([0-9]+)\.([0-9]+).*/\1.\2/')"

          {
            echo "### Requirements"
            echo "Built against OBS Studio ${obs_version} — **requires OBS Studio ${min_obs} or newer**. Older OBS versions refuse to load it (\"The following OBS plugins failed to load: win-spout\")."
            echo ""
            echo "- \`OBS_Spout2_Plugin_Install_*.exe\`: installer for a standard OBS install (installs to \`C:\\ProgramData\\obs-studio\\plugins\\win-spout\`)"
            echo "- \`*-windows-x64.zip\`: the same layout as the installer, for manual installs"
            echo "- \`*-windows-x64-portable.zip\`: extract onto a portable OBS folder (\`plugins\\win-spout\`)"
            echo ""
            echo "### Checksums"
          } > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz
