[pytest]
testpaths = .
python_files = test_*.py
pythonpath = .
addopts = -ra -p no:cacheprovider
timeout = 180
timeout_method = thread
xfail_strict = true
markers =
    obs: needs the portable OBS and the installed plugin (GPU box only)
    gpu: needs a real GPU (never runs on hosted CI)
    dual_gpu: needs two display adapters
filterwarnings =
    ignore::DeprecationWarning
log_level = INFO
